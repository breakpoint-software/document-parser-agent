<div class="mx-auto max-w-7xl space-y-5 sm:space-y-6">
  <header class="flex flex-wrap items-center gap-x-3 gap-y-2">
    <h1 class="text-2xl font-semibold leading-tight sm:text-3xl">Dashboard</h1>
    <span class="break-all text-sm text-neutral-500 dark:text-neutral-400">{{ workspaceId }}</span>
    <div *ngIf="workspace" class="ml-auto flex items-center gap-2">
      <button *ngIf="!isEditing" mat-stroked-button class="responsive-action" type="button" aria-label="Edit workspace" (click)="editRouting()"><svg lucidePencil class="responsive-action__icon mr-2 inline h-4 w-4" aria-hidden="true"></svg><span class="sr-only sm:not-sr-only">Edit</span></button>
      <button *ngIf="isEditing" mat-button class="responsive-action" type="button" aria-label="Cancel workspace changes" (click)="cancelEditing()"><svg lucideX class="responsive-action__icon mr-2 inline h-4 w-4" aria-hidden="true"></svg><span class="sr-only sm:not-sr-only">Cancel</span></button>
      <button *ngIf="isEditing" mat-flat-button class="responsive-action" type="submit" form="workspace-settings-form" aria-label="Save workspace"><svg lucideSave class="responsive-action__icon mr-2 inline h-4 w-4" aria-hidden="true"></svg><span class="sr-only sm:not-sr-only">Save</span></button>
    </div>
  </header>

  <app-status-banner *ngIf="isLoading" type="loading" message="Loading workspace..." [dismissible]="false" />
  <app-status-banner *ngIf="errorMessage" type="error" [message]="errorMessage" (dismissed)="errorMessage = ''" />
  <app-status-banner *ngIf="successMessage" type="success" [message]="successMessage" (dismissed)="successMessage = ''" />

  <section *ngIf="workspace" class="space-y-4 border-b border-neutral-200 pb-6 dark:border-neutral-700" aria-label="Workspace settings">
    <form id="workspace-settings-form" [formGroup]="routingForm" (ngSubmit)="saveRouting()" class="space-y-4" novalidate>
      <div class="grid gap-4 md:grid-cols-2">
      <div>
        <label for="workspace-name" class="mb-2 block font-medium">Workspace</label>
        <mat-form-field appearance="outline" class="w-full">
          <input id="workspace-name" matInput formControlName="name">
          <mat-error>Enter a workspace name.</mat-error>
        </mat-form-field>
      </div>
      <div>
        <label for="inbox-folder" class="mb-2 block font-medium">Inbox folder</label>
        <mat-form-field appearance="outline" class="w-full">
          <input id="inbox-folder" matInput formControlName="inbox_folder_name" readonly>
          <button mat-icon-button matSuffix type="button" aria-label="Select inbox folder" (click)="openInboxPicker()" [disabled]="!pickerReady || !isEditing"><svg lucideFolderOpen class="h-5 w-5" aria-hidden="true"></svg></button>
          <mat-error>Select an inbox folder.</mat-error>
        </mat-form-field>
      </div>
      <div>
        <label for="schema-id" class="mb-2 block font-medium">Extraction scheme</label>
        <mat-form-field appearance="outline" class="w-full">
          <mat-select id="schema-id" formControlName="schema_id">
            <mat-option *ngFor="let scheme of extractionSchemes" [value]="scheme.schema_id">{{ scheme.name }} (v{{ scheme.version }})</mat-option>
          </mat-select>
          <mat-error>Select an extraction scheme.</mat-error>
        </mat-form-field>
      </div>
      <div class="flex items-center"><mat-slide-toggle formControlName="include_subfolders">Include subfolders</mat-slide-toggle></div>
      </div>
    </form>
  </section>

  <app-rules-management [workspaceId]="workspaceId" [schemaId]="routingForm.controls.schema_id.value" [embedded]="true"></app-rules-management>
</div>

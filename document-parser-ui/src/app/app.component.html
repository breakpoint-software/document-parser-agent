<a mat-raised-button href="#main-content" class="skip-link">Skip to main content</a>
<div class="flex h-screen flex-col overflow-hidden bg-white text-[#1f1f1f] transition-colors duration-200 dark:bg-[#212121] dark:text-[#ececec]">
  <mat-toolbar class="z-30 shrink-0 border-b border-[#e5e5e5] !bg-white px-3 !text-[#1f1f1f] transition-colors duration-200 sm:px-4 dark:border-[#383838] dark:!bg-[#212121] dark:!text-[#ececec]">
    <button mat-icon-button type="button" aria-label="Open navigation" (click)="drawer.toggle()">
      <svg lucideMenu class="h-5 w-5" aria-hidden="true"></svg>
    </button>
    <a mat-icon-button routerLink="/" aria-label="Document Parser home" matTooltip="Home">
      <svg lucideFileScan class="h-7 w-7" aria-hidden="true"></svg>
    </a>
    <span class="ml-2 truncate text-base font-semibold">{{ pageTitle() }}</span>

    <span class="flex-1"></span>

    <button mat-icon-button type="button" (click)="toggleTheme()" [attr.aria-label]="isDarkMode() ? 'Use light theme' : 'Use dark theme'" [matTooltip]="isDarkMode() ? 'Light theme' : 'Dark theme'">
      <svg *ngIf="!isDarkMode()" lucideMoon class="h-5 w-5" aria-hidden="true"></svg>
      <svg *ngIf="isDarkMode()" lucideSun class="h-5 w-5" aria-hidden="true"></svg>
    </button>
    <a mat-icon-button routerLink="/" aria-label="Account" matTooltip="Account">
      <svg lucideUserRound class="h-6 w-6" aria-hidden="true"></svg>
    </a>
  </mat-toolbar>

  <mat-sidenav-container class="min-h-0 flex-1 !bg-white transition-colors duration-200 dark:!bg-[#212121]">
    <mat-sidenav
      #drawer
      class="platform-nav w-72"
      [mode]="isHandset() ? 'over' : 'side'"
      [opened]="!isHandset()"
      aria-label="Primary navigation"
    >
      <div class="flex h-full flex-col p-3">
        <mat-nav-list class="flex-1 py-3" aria-label="Application sections">
          <a mat-list-item routerLink="/" routerLinkActive #home="routerLinkActive" [routerLinkActiveOptions]="{ exact: true }" [activated]="home.isActive" (click)="closeMobileDrawer(drawer)">
            <svg matListItemIcon lucideHouse class="h-5 w-5" aria-hidden="true"></svg>
            <span matListItemTitle>Home</span>
          </a>
          <a *ngIf="isAuthenticated()" mat-list-item [routerLink]="dashboardLink()" routerLinkActive #dashboard="routerLinkActive" [activated]="dashboard.isActive" (click)="closeMobileDrawer(drawer)">
            <svg matListItemIcon lucideLayoutDashboard class="h-5 w-5" aria-hidden="true"></svg>
            <span matListItemTitle>Dashboard</span>
          </a>
        </mat-nav-list>

        <mat-divider></mat-divider>
        <mat-nav-list *ngIf="isAuthenticated()" class="py-2" aria-label="Account actions">
          <button mat-list-item type="button" (click)="logout(drawer)">
            <svg matListItemIcon lucideLogOut class="h-5 w-5" aria-hidden="true"></svg>
            <span matListItemTitle>Log out</span>
          </button>
        </mat-nav-list>
        <mat-divider *ngIf="isAuthenticated()"></mat-divider>
        <p class="px-2 pt-4 text-xs">DocParser v1.0.0</p>
      </div>
    </mat-sidenav>

    <mat-sidenav-content class="min-w-0 !bg-white transition-colors duration-200 dark:!bg-[#212121]">
      <div class="mx-auto w-full max-w-[1440px] px-4 py-6 sm:px-8 lg:px-12 lg:py-10 2xl:px-16">
        <nav *ngIf="breadcrumbs().length > 1" aria-label="Breadcrumb" class="mb-4">
          <ol class="flex flex-wrap items-center gap-1 text-sm">
            <li *ngFor="let breadcrumb of breadcrumbs(); let last = last" class="flex items-center gap-1">
              <a *ngIf="breadcrumb.route && !last" mat-button [routerLink]="breadcrumb.route">{{ breadcrumb.label }}</a>
              <span *ngIf="!breadcrumb.route || last" class="px-2" [attr.aria-current]="last ? 'page' : null">{{ breadcrumb.label }}</span>
              <span *ngIf="!last" aria-hidden="true">/</span>
            </li>
          </ol>
        </nav>

        <main id="main-content">
          <router-outlet></router-outlet>
        </main>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>

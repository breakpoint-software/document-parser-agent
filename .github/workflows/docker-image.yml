name: Build and deploy services

on:
  push:
    branches: [main]
    paths:
      - document-parser/**
      - document-parser-api/**
      - document-parser-ui/**
      - .github/workflows/docker-image.yml
  workflow_dispatch:

env:
  PROCESSOR_IMAGE: breakpointsoftware/document-parser-agent-api
  API_IMAGE: breakpointsoftware/document-parser-api
  UI_IMAGE: breakpointsoftware/document-parser-ui
  PROCESSOR_SERVICE: document-parser-agent-api-1
  API_SERVICE: document-parser-api
  UI_SERVICE: document-parser-ui
  REGION: us-central1

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed services
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            processor:
              - 'document-parser/**'
            api:
              - 'document-parser-api/**'
            ui:
              - 'document-parser-ui/**'

      - name: Validate deployment configuration
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.processor == 'true' ||
          steps.changes.outputs.api == 'true' ||
          steps.changes.outputs.ui == 'true'
        shell: bash
        env:
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          FIREBASE_WORKSPACES_COLLECTION: ${{ vars.FIREBASE_WORKSPACES_COLLECTION }}
          FIREBASE_EXTRACTION_SCHEMES_COLLECTION: ${{ vars.FIREBASE_EXTRACTION_SCHEMES_COLLECTION }}
          GOOGLE_DRIVE_INVOICES_BASE_PATH: ${{ vars.GOOGLE_DRIVE_INVOICES_BASE_PATH }}
          FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_PICKER_API_KEY: ${{ vars.GOOGLE_PICKER_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ vars.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          PROCESSOR_API_URL: ${{ vars.PROCESSOR_API_URL }}
        run: |
          required=(
            OPENAI_MODEL FIREBASE_WORKSPACES_COLLECTION FIREBASE_EXTRACTION_SCHEMES_COLLECTION
            GOOGLE_DRIVE_INVOICES_BASE_PATH FIREBASE_DATABASE_URL FIREBASE_API_KEY
            FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID FIREBASE_STORAGE_BUCKET
            FIREBASE_MESSAGING_SENDER_ID FIREBASE_APP_ID GOOGLE_CLIENT_ID
            GOOGLE_PICKER_API_KEY GOOGLE_SERVICE_ACCOUNT_EMAIL PROCESSOR_API_URL
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required repository variable: ${name}" >&2
              exit 1
            fi
          done

      - name: Log in to Docker Hub
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.processor == 'true' ||
          steps.changes.outputs.api == 'true' ||
          steps.changes.outputs.ui == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push processor
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.processor == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./document-parser
          file: ./document-parser/Dockerfile
          push: true
          tags: |
            ${{ env.PROCESSOR_IMAGE }}:latest
            ${{ env.PROCESSOR_IMAGE }}:${{ github.sha }}

      - name: Build and push API
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./document-parser-api
          file: ./document-parser-api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Build and push UI
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.ui == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./document-parser-ui
          file: ./document-parser-ui/Dockerfile
          push: true
          tags: |
            ${{ env.UI_IMAGE }}:latest
            ${{ env.UI_IMAGE }}:${{ github.sha }}

      - name: Authenticate to Google Cloud
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.processor == 'true' ||
          steps.changes.outputs.api == 'true' ||
          steps.changes.outputs.ui == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy processor
        id: deploy-processor
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.processor == 'true'
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.PROCESSOR_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.PROCESSOR_IMAGE }}:${{ github.sha }}
          flags: --port=8000 --allow-unauthenticated
          env_vars: |
            OPENAI_MODEL=${{ vars.OPENAI_MODEL }}
            FIREBASE_WORKSPACES_COLLECTION=${{ vars.FIREBASE_WORKSPACES_COLLECTION }}
            FIREBASE_EXTRACTION_SCHEMES_COLLECTION=${{ vars.FIREBASE_EXTRACTION_SCHEMES_COLLECTION }}
            GOOGLE_DRIVE_INVOICES_BASE_PATH=${{ vars.GOOGLE_DRIVE_INVOICES_BASE_PATH }}
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}

      - name: Deploy API
        id: deploy-api
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.api == 'true' || steps.changes.outputs.ui == 'true'
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.API_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.API_IMAGE }}:${{ github.sha }}
          flags: --port=3000 --allow-unauthenticated
          env_vars: |
            CORS_ORIGINS=${{ vars.UI_ORIGIN }}
            FIREBASE_DATABASE_URL=${{ vars.FIREBASE_DATABASE_URL }}
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
            PROCESSOR_API_URL=${{ vars.PROCESSOR_API_URL }}

      - name: Deploy UI
        id: deploy-ui
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.ui == 'true'
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.UI_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.UI_IMAGE }}:${{ github.sha }}
          flags: --port=80 --allow-unauthenticated
          env_vars: |
            API_BASE_URL=${{ steps.deploy-api.outputs.url }}/api
            FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}
            FIREBASE_AUTH_DOMAIN=${{ vars.FIREBASE_AUTH_DOMAIN }}
            FIREBASE_DATABASE_URL=${{ vars.FIREBASE_DATABASE_URL }}
            FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
            FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}
            FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
            FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
            GOOGLE_PICKER_API_KEY=${{ vars.GOOGLE_PICKER_API_KEY }}
            GOOGLE_SERVICE_ACCOUNT_EMAIL=${{ vars.GOOGLE_SERVICE_ACCOUNT_EMAIL }}

      - name: Update API allowed UI origins
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.ui == 'true'
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.API_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.API_IMAGE }}:${{ github.sha }}
          flags: --port=3000 --allow-unauthenticated
          env_vars: |
            CORS_ORIGINS=${{ steps.deploy-ui.outputs.url }},${{ vars.UI_ORIGIN }}
            PROCESSOR_API_URL=${{ vars.PROCESSOR_API_URL }}
          
